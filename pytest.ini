[pytest]
# testpaths 只在不带参数运行 pytest 时生效，不影响 pytest tests/<role>/... 的用法
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册自定义标记，避免 PytestUnknownMarkWarning 淹没真正的告警
markers =
    smoke: 冒烟用例，改动后最先跑的一小撮
    regression: 全量回归用例
    slow: 耗时较长，按需跳过

# 不设 --env 默认值：环境必须由使用者显式指定（见 rules/agent-behavior）
addopts = -ra --strict-markers
