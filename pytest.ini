[pytest]
# 代码部分统一在 framework/ 下，harness（skills/rules/hooks/docs）留在仓库根 ——
# 根级 skills/ 是 Claude Code 识别插件的标志，不能挪走。
# 这份 ini 留在根目录，使得在仓库根直接 pytest 也能正确找到代码与包路径。
testpaths = framework/tests
pythonpath = framework

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册自定义标记，避免 PytestUnknownMarkWarning 淹没真正的告警
markers =
    smoke: 冒烟用例，改动后最先跑的一小撮
    regression: 全量回归用例
    slow: 耗时较长，按需跳过

# 不设 --env 默认值：环境必须由使用者显式指定（见 rules/agent-behavior）
# allure 结果固定落在 reports/allure-results（gitignore），test-runner skill 里的 allure serve 命令直接可用
addopts = -ra --strict-markers --alluredir=reports/allure-results

# 运行日志由 pytest 统一落盘，每次运行覆盖；框架 logger 在 pytest 下向 root 传播（见 core/logger.py）
log_file = reports/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
